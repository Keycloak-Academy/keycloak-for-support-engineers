services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: INFO
    command: ['start-dev', '--import-realm']
    ports:
      - "8080:8080"
    volumes:
      - ./sandbox-realm/support-sandbox-realm.json:/opt/keycloak/data/import/support-sandbox-realm.json
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  openldap:
    # Local LDAP directory backing Module 6. Seeded from sandbox-realm/ldap/*.ldif
    # at first start: one healthy user (alice.ldap), one "new hire" entry
    # (peter.newhire) that Module 6B imports, plus two background users so the
    # directory does not look suspiciously sparse.
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    container_name: openldap
    environment:
      LDAP_ROOT: dc=acme,dc=test
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_ADMIN_ENABLED: 'no'
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_LOGLEVEL: '0'
    volumes:
      - ./sandbox-realm/ldap:/ldifs:ro
    ports:
      - "1389:1389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:1389 -b dc=acme,dc=test -D 'cn=admin,dc=acme,dc=test' -w admin '(uid=peter.newhire)' uid >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  demo-app:
    build: ./demo-app
    container_name: demo-app
    # Share the host network so the demo-app server reaches Keycloak at the
    # same http://localhost:8080 URL the browser uses. Identical issuer URLs
    # on both sides keep OIDC token validation happy and remove the need for
    # host.docker.internal. Requires Docker Desktop 4.34+ on Windows/Mac.
    network_mode: host
    environment:
      KEYCLOAK_BASE_URL: http://localhost:8080
      APP_BASE_URL: http://localhost:3000
      WEB_APP_CLIENT_SECRET: web-app-secret-not-for-production
      SESSION_SECRET: local-dev-secret-change-for-production
      PORT: 3000
    depends_on:
      keycloak:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    environment:
      # Reject SMTP recipients that aren't on the @acme.test domain. Without
      # this, Mailpit silently accepts typo'd addresses (e.g. erin@acmm.test)
      # and Module 3B's "fix the email typo" step loses its bite. With it,
      # Keycloak's send fails until the learner corrects the address.
      MP_SMTP_ALLOWED_RECIPIENTS: '@acme.test$'
    ports:
      - "8025:8025"   # web UI — open http://localhost:8025 to read caught emails
